<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Virtual Piano</title>
  </head>
  <body>
    <h1>Virtual Piano</h1>

    <div class="piano">
      <!--  upper row -->
      <div class="key" data-key="q">Q</div>
      <div class="key" data-key="w">W</div>
      <div class="key" data-key="e">E</div>
      <div class="key" data-key="r">R</div>
      <div class="key" data-key="t">T</div>
      <div class="key" data-key="y">Y</div>
      <div class="key" data-key="u">U</div>
      <div class="key" data-key="i">I</div>
      <div class="key" data-key="o">O</div>
      <div class="key" data-key="p">P</div>

      <!-- middle  -->
      <div class="key wide" data-key="a">A</div>
      <div class="key wide" data-key="s">S</div>
      <div class="key wide" data-key="d">D</div>
      <div class="key wide" data-key="f">F</div>
      <div class="key wide" data-key="g">G</div>
      <div class="key wide" data-key="h">H</div>
      <div class="key wide" data-key="j">J</div>
      <div class="key wide" data-key="k">K</div>
      <div class="key wide" data-key="l">L</div>

      <!-- lower  -->
      <div class="key" data-key="z">Z</div>
      <div class="key" data-key="x">X</div>
      <div class="key" data-key="c">C</div>
      <div class="key" data-key="v">V</div>
      <div class="key" data-key="b">B</div>
      <div class="key" data-key="n">N</div>
      <div class="key" data-key="m">M</div>

      <!-- 123 Row -->
      <div class="key num" data-key="1">1</div>
      <div class="key num" data-key="2">2</div>
      <div class="key num" data-key="3">3</div>
      <div class="key num" data-key="4">4</div>
      <div class="key num" data-key="5">5</div>
      <div class="key num" data-key="6">6</div>
      <div class="key num" data-key="7">7</div>
      <div class="key num" data-key="8">8</div>
      <div class="key num" data-key="9">9</div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
