<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Document</title>
  </head>
  <body>
    <main>
      <section class="hero-section">
        <div class="top">
          <h2>It's a great day for coffee</h2>
          <button>Start an order</button>
        </div>
        <div class="bottom">
          <img
            class="first"
            src="https://content-prod-live.cert.starbucks.com/binary/v2/asset/137-103312.jpg"
            alt="coffee"
          />
          <div class="second">
            <h3>It’s Reusable Red Cup Day</h3>
            <p>
              Today only, purchase a handcrafted holiday drink and get a free
              reusable red cup. Order in-store, at the drive thru, or order
              ahead on the app to take yours home.
            </p>
            <button>Order Now</button>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
